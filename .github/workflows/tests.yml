name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Run Godot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import assets
        run: godot --headless --editor --path . --import

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find tests -type f -name '*_test.gd' -print | sort)

          if [[ ${#test_files[@]} -eq 0 ]]; then
            echo "No *_test.gd scripts found under tests/."
            exit 1
          fi

          for test_file in "${test_files[@]}"; do
            echo "Running $test_file"
            test_log="$(mktemp)"
            if ! godot --headless --path . --script "$test_file" >"$test_log" 2>&1; then
              cat "$test_log"
              exit 1
            fi
            cat "$test_log"
            # Godot can return zero for script parse errors.
            if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' "$test_log"; then
              exit 1
            fi
          done
