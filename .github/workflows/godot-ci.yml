name: "godot-ci export"
on: push

env:
  EXPORT_NAME: godotcraft-win

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import assets
        run: godot --headless --editor --path . --import
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --path . --export-release "Windows Desktop" "$PWD/build/windows/$EXPORT_NAME.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
